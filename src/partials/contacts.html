<section class="contact-section" id="contact">
  <div class="container">
    <svg class="divider-icon" width="300" height="20">
      <use href="../images/sprite.svg#icon-decor"></use>
    </svg>

    <div class="contact-content">
      <div class="container-divider">
        <h2 class="heading-large">Let's Tell Your Story</h2>
        <p>
          I can't wait to hear more about your wedding! Tell me about your
          plans, and I'll be in touch to discuss how we can create magic
          together.
        </p>
        <!-- Contact information -->
        <address class="contact-info">
          <ul class="contact-info-list">
            <li class="contact-info-link">
              <a
                class="soc-link text-regular-normal"
                href="mailto:info@mariakovalenko.com"
              >
                <svg class="contact-info-icon" width="24" height="24">
                  <use href="./images/sprite.svg#icon-close"></use>
                </svg>
                <span>info@mariakovalenko.com</span>
              </a>
            </li>
            <li class="contact-info-link">
              <a class="soc-link text-regular-normal" href="tel:+405551234567">
                <svg class="contact-info-icon" width="24" height="24">
                  <use href="./images/sprite.svg#icon-mail"></use>
                </svg>
                <span>+40 (555) 123-4567</span>
              </a>
            </li>
            <li class="contact-info-link">
              <a
                class="soc-link text-regular-normal"
                href="https://maps.google.com/?q=Raschdorffstraße+2-26,+13409+Berlin,+Germany"
                target="_blank"
                rel="noopener noreferrer"
              >
                <svg class="contact-info-icon" width="24" height="24">
                  <use href="./images/sprite.svg#icon-call"></use>
                </svg>
                <span> Raschdorffstraße 2-26, 13409 Berlin, Germany </span>
              </a>
            </li>
          </ul>
        </address>
      </div>

      <!-- Contact form -->
      <form class="contact-form">
        <div class="contact-form-field">
          <label class="text-regular-normal" for="name"> Name* </label>

          <input
            class="contact-form-input text-regular-normal"
            type="text"
            id="name"
            name="name"
            placeholder="Maria"
            required
          />
        </div>

        <div class="contact-form-field">
          <label class="text-regular-normal" for="phone"> Phone* </label>

          <input
            class="contact-form-input text-regular-normal"
            type="tel"
            id="phone"
            name="phone"
            placeholder="+1 (202) 111 2323"
            required
          />
        </div>

        <div class="contact-form-field">
          <label class="text-regular-normal" for="message"> Message </label>

          <textarea
            class="contact-form-textarea text-regular-normal"
            id="message"
            name="message"
            rows="7"
            placeholder="Tell me a little about you and your special day. Don't forget to include your wedding date, venue, and what you're most excited about..."
          ></textarea>
        </div>

        <button class="form-button button" type="submit">Let's Talk</button>
      </form>
    </div>
  </div>
</section>
