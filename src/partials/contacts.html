<section class="contacts">
  <div class="container contacts-container">
    <div class="contacts-info">
      <div class="contacts-decor-wrap">
        <svg class="contacts-decor" aria-hidden="true">
          <use href="../images/sprite.svg#icon-decoration"></use>
        </svg>
      </div>

      <h2 class="heading-large">Let's Tell Your Story</h2>

      <p class="contacts-description">
        I can't wait to hear more about your wedding! Tell me about your plans,
        and I'll be in touch to discuss how we can create magic together.
      </p>

      <ul class="contacts-details">
        <li class="contacts-item">
          <svg class="contacts-icon" aria-hidden="true" width="18" height="18">
            <use href="../images/sprite.svg#icon-close"></use>
          </svg>
          <a class="text-regular-normal" href="mailto:info@mariakovalenko.com">info@mariakovalenko.com</a>
         </li>
        
        <li class="contacts-item">
          <svg class="contacts-icon" aria-hidden="true" width="18" height="18">
            <use href="../images/sprite.svg#icon-mail"></use>
          </svg>
          <a class="text-regular-normal" href="tel:+405551234567">+40 (555) 123-4567</a>
        </li>

        <li class="contacts-item">
          <svg class="contacts-icon" aria-hidden="true" width="18" height="18">
            <use href="../images/sprite.svg#icon-call"></use>
          </svg>
          <a class="text-regular-medium contacts-link-address"
          href="https://www.google.com/maps/search/?api=1&query=Raschdorffstraße+2-26,+13409+Berlin,+Germany"
          target="_blank"
          rel="noopener noreferrer">Raschdorffstraße 2-26, 13409 Berlin, Germany</a>
        </li>
      </ul>
    </div>

    <form class="contacts-form">
      <div class="contacts-field">
        <label class="text-regular-medium" for="name">Name*</label>
        <input
          class="contacts-input"
          type="text"
          id="name"
          name="name"
          placeholder="Maria"
          required
        />
      </div>

      <div class="contacts-field">
        <label class="text-regular-medium" for="phone">Phone*</label>
        <input
          class="contacts-input"
          type="tel"
          id="phone"
          name="phone"
          placeholder="+1 (202) 111 2323"
          required
        />
      </div>

      <div class="contacts-field">
        <label class="text-regular-medium" for="message">Message</label>
        <textarea
          class="contacts-textarea"
          id="message"
          name="message"
          placeholder="Tell me a little about you and your special day. Don't forget to include your wedding date, venue, and what you're most excited about..."
        ></textarea>
      </div>

      <button class="button" type="submit">Let's Talk</button>
    </form>
  </div>
</section>
