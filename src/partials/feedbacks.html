<section id="feedbacks" class="section is-feedback">
  <div class="container is-feedback">
    <svg class="sec-decoration" width="299" height="20">
      <use href="../images/sprite.svg#icon-decoration"></use>
    </svg>

    <h2 class="heading-large feedbacks-title">
      Words from Our Wonderful Couples
    </h2>
    <p class="feedbacks-subtitle">
      Read what the couples who entrusted us with their most precious memories
      have to say.
    </p>

    <div class="swiper feedbacks-slider">
      <ul class="swiper-wrapper" id="feedbacks-wrapper"></ul>

      <div class="feedbacks-slider-bottom">
        <div class="swiper-pagination-custom" id="feedbacks-pagination"></div>

        <div class="swiper-navigation">
          <button
            type="button"
            class="swiper-button-prev-custom slider-btn"
            aria-label="Previous slide"
          >
            <svg width="24" height="24" aria-hidden="true">
              <use href="./images/sprite.svg#icon-forward"></use>
            </svg>
          </button>

          <button
            type="button"
            class="swiper-button-next-custom slider-btn"
            aria-label="Next slide"
          >
            <svg width="24" height="24" aria-hidden="true">
              <use href="./images/sprite.svg#icon-forward"></use>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
